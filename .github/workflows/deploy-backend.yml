name: Deploy Backend (App Service)

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: shippulse-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src/ShipPulse.Tests/ShipPulse.Tests.csproj
      - run: dotnet build src/ShipPulse.Tests/ShipPulse.Tests.csproj --configuration Release --no-restore
      - run: dotnet test src/ShipPulse.Tests/ShipPulse.Tests.csproj --configuration Release --no-build
      - run: dotnet publish src/ShipPulse.Api/ShipPulse.Api.csproj -c Release -o ./publish
      - name: Create deployment zip
        run: |
          cd publish
          zip -r ../shippulse-api.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: shippulse-api
          path: ./shippulse-api.zip

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shippulse-api
          path: .

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infra (Bicep)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create \
              --name dev-${{ github.run_id }} \
              --resource-group ${{ secrets.AZURE_RG_DEV }} \
              --template-file infra/main.bicep \
              --parameters infra/env/dev.bicepparam \
              ${{ secrets.ADDITIONAL_BICEP_PARAMS_DEV }}

      - name: Deploy Web App package
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment source config-zip \
              --resource-group ${{ secrets.AZURE_RG_DEV }} \
              --name ${{ secrets.AZURE_WEBAPP_NAME_DEV }} \
              --src shippulse-api.zip

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shippulse-api
          path: .

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infra (Bicep)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create \
              --name prod-${{ github.run_id }} \
              --resource-group ${{ secrets.AZURE_RG_PROD }} \
              --template-file infra/main.bicep \
              --parameters infra/env/prod.bicepparam \
              ${{ secrets.ADDITIONAL_BICEP_PARAMS_PROD }}

      - name: Deploy Web App package
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment source config-zip \
              --resource-group ${{ secrets.AZURE_RG_PROD }} \
              --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} \
              --src shippulse-api.zip
              --slot uat

      - name: Deploy Web App package
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment source config-zip \
              --resource-group ${{ secrets.AZURE_RG_PROD }} \
              --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} \
              --src shippulse-api.zip
              --slot qa
