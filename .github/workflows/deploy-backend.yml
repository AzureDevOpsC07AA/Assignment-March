name: Deploy Backend (App Service)

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: shippulse-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet publish src/ShipPulse.Api/ShipPulse.Api.csproj -c Release -o ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: shippulse-api
          path: ./publish

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shippulse-api
          path: ./publish

      - name: Azure login (OIDC recommended)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infra (Bicep)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create               --resource-group ${{ secrets.AZURE_RG_DEV }}               --template-file infra/main.bicep               --parameters infra/env/dev.bicepparam

      - name: Deploy Web App package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_DEV }}
          package: ./publish

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shippulse-api
          path: ./publish

      - name: Azure login (OIDC recommended)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infra (Bicep)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az deployment group create               --resource-group ${{ secrets.AZURE_RG_PROD }}               --template-file infra/main.bicep               --parameters infra/env/prod.bicepparam

      - name: Deploy Web App package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          package: ./publish
