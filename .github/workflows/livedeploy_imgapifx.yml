# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - imgapifx

on:
  push:
    branches:
      - livedeploy
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 'v10.0.x'

      - run: dotnet restore src/ShipPulse.Tests/ShipPulse.Tests.csproj

      - name: Build with dotnet
        run: dotnet build src/ShipPulse.Tests/ShipPulse.Tests.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish src/ShipPulse.Api/ShipPulse.Api.csproj -c Release -o ./publish

      - name: Create deployment zip
        id: zipdeploycreator
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./shippulse-api.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: shippulse-api
          path: ./shippulse-api.zip

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: shippulse-api
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'imgapifx'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CE0536E20ADA4FF8894EAD05492D0FDB }}
