# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - todo

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact_name: shippulse-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/ShipPulse.Tests/ShipPulse.Tests.csproj

      - name: Build with dotnet
        run: dotnet build src/ShipPulse.Tests/ShipPulse.Tests.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish src/ShipPulse.Api/ShipPulse.Api.csproj -c Release -o ./publish
      - name: Create deployment zip
        id: zipdeploycreator
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./shippulse-api.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name:  shippulse-api
          path: ./shippulse-api.zip

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: shippulse-api
          path: .
      
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B0B1589EED7D4E71A3229506CE5C1DE5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C2741C944B594139AF81981AB22D75AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2927DAB8229341BE8613F0CF4CEF601B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'todo'
          slot-name: 'uat'
          package: shippulse-api.zip
          
