name: Deploy Frontend (Static Web Apps)

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Static Web Apps token
        uses: azure/CLI@v2
        with:
          inlineScript: |
            for i in $(seq 1 30); do
              token=$(az staticwebapp secrets list --name ${{ secrets.AZURE_STATIC_WEBAPP_NAME_DEV }} --resource-group ${{ secrets.AZURE_RG_DEV }} --query properties.apiKey -o tsv 2>/dev/null)
              if [ -n "$token" ]; then
                break
              fi
              echo "Static Web App not ready yet. Retry $i/30..."
              sleep 20
            done
            if [ -z "$token" ]; then
              echo "Static Web Apps deployment token was empty." >&2
              exit 1
            fi
            echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Prepare config
        run: |
          cp src/ShipPulse.Web/wwwroot/appsettings.template.json src/ShipPulse.Web/wwwroot/appsettings.json
          sed -i 's|__API_BASE_URL__|${{ secrets.API_BASE_URL_DEV }}|g' src/ShipPulse.Web/wwwroot/appsettings.json

      - name: Build static site
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet publish src/ShipPulse.Web/ShipPulse.Web.csproj -c Release -o ./webpublish

      - name: Deploy to Static Web Apps (dev)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: "upload"
          app_location: "./webpublish/wwwroot"
          output_location: ""

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Static Web Apps token
        uses: azure/CLI@v2
        with:
          inlineScript: |
            for i in $(seq 1 30); do
              token=$(az staticwebapp secrets list --name ${{ secrets.AZURE_STATIC_WEBAPP_NAME_PROD }} --resource-group ${{ secrets.AZURE_RG_PROD }} --query properties.apiKey -o tsv 2>/dev/null)
              if [ -n "$token" ]; then
                break
              fi
              echo "Static Web App not ready yet. Retry $i/30..."
              sleep 20
            done
            if [ -z "$token" ]; then
              echo "Static Web Apps deployment token was empty." >&2
              exit 1
            fi
            echo "SWA_DEPLOYMENT_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Prepare config
        run: |
          cp src/ShipPulse.Web/wwwroot/appsettings.template.json src/ShipPulse.Web/wwwroot/appsettings.json
          sed -i 's|__API_BASE_URL__|${{ secrets.API_BASE_URL_PROD }}|g' src/ShipPulse.Web/wwwroot/appsettings.json

      - name: Build static site
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet publish src/ShipPulse.Web/ShipPulse.Web.csproj -c Release -o ./webpublish

      - name: Deploy to Static Web Apps (prod)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: "upload"
          app_location: "./webpublish/wwwroot"
          output_location: ""
