name: Deploy Frontend (Static Web Apps)

on:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Prepare config
        run: |
          cp src/ShipPulse.Web/wwwroot/appsettings.template.json src/ShipPulse.Web/wwwroot/appsettings.json
          sed -i 's|__API_BASE_URL__|${{ secrets.API_BASE_URL_DEV }}|g' src/ShipPulse.Web/wwwroot/appsettings.json

      - name: Build static site
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/ShipPulse.Web/ShipPulse.Web.csproj -c Release -o ./webpublish

      - name: Deploy to Static Web Apps (dev)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: "upload"
          app_location: "./webpublish/wwwroot"
          output_location: ""

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Prepare config
        run: |
          cp src/ShipPulse.Web/wwwroot/appsettings.template.json src/ShipPulse.Web/wwwroot/appsettings.json
          sed -i 's|__API_BASE_URL__|${{ secrets.API_BASE_URL_PROD }}|g' src/ShipPulse.Web/wwwroot/appsettings.json

      - name: Build static site
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/ShipPulse.Web/ShipPulse.Web.csproj -c Release -o ./webpublish

      - name: Deploy to Static Web Apps (prod)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          action: "upload"
          app_location: "./webpublish/wwwroot"
          output_location: ""
