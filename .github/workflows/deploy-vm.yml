name: Deploy Legacy API to Azure VM

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'vm-demo/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Login to GHCR
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/legacy-inventory-api:latest ./vm-demo/app

    - name: Push Docker Image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/legacy-inventory-api:latest

    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_PUBLIC_IP }}
        username: azureuser
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd /opt/apps
          ./deploy.sh