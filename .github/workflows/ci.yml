name: CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ShipPulse.Tests/ShipPulse.Tests.csproj

      - name: Build
        run: dotnet build src/ShipPulse.Tests/ShipPulse.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/ShipPulse.Tests/ShipPulse.Tests.csproj --no-build --configuration Release

      - name: Publish API artifact
        run: dotnet publish src/ShipPulse.Api/ShipPulse.Api.csproj -c Release -o ./artifacts/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: shippulse-api
          path: ./artifacts/api

      - name: Publish Web artifact (static)
        run: |
          # Inject API base url placeholder for CI only
          cp src/ShipPulse.Web/wwwroot/appsettings.template.json src/ShipPulse.Web/wwwroot/appsettings.json
          sed -i 's|__API_BASE_URL__|http://localhost:5080|g' src/ShipPulse.Web/wwwroot/appsettings.json
          dotnet publish src/ShipPulse.Web/ShipPulse.Web.csproj -c Release -o ./artifacts/web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: shippulse-web
          path: ./artifacts/web/wwwroot
